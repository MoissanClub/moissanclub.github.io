<header class="site-header shell">
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="Moissan Club home">
    <span class="brand-mark" aria-hidden="true">✳</span>
    <span>MOISSAN <span class="brand-light">CLUB</span></span>
  </a>
  <nav class="site-nav" aria-label="Main navigation">
    {{ range site.Menus.main }}
    {{ $active := or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) (and (eq .Identifier "newsletter") (eq $.Section "newsletter")) }}
    <a href="{{ .URL }}"{{ if $active }} class="is-active"{{ end }}{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
